<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Drag and Drop</title>

    <style>
        #dropBox {
            width: 300px;
            height: 200px;
            border: 2px dashed black;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 100px auto;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div id="dropBox">
        Drag PDF Here
    </div>


<script>

const dropBox = document.getElementById("dropBox");

// Jab PDF ko box ke upar lekar aate ho
dropBox.addEventListener("dragover", function(e){
    e.preventDefault();
    console.log("File is over drop area");
    // e.dataTransfer.setData("text", e.target.id);
});

// Jab PDF chhod dete ho
dropBox.addEventListener("drop", function(e){
    e.preventDefault();
    console.log("PDF Dropped");
    // File lena
    let file = e.dataTransfer.files[0];
    console.log(file);
    // Check PDF hai ya nahi
    if(file.type === "application/pdf"){
        console.log("PDF Uploaded");
        console.log("File Name:", file.name);
        console.log("File Size:", file.size);
        dropBox.innerHTML = `
            PDF Name: ${file.name}
        `;
    }
    else{
        console.log("Only PDF allowed");
        dropBox.innerHTML = "Only PDF allowed";
    }
});

</script>

</body>
</html>
