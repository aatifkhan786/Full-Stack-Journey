<!-- // HTML:
// <img id="owl" src="owl.jpg" alt="owl">

// ============================================================
// APPROACH 1 — Directly HTML mein (AVOID)
// ============================================================
// <img onclick="alert('owl')">
// Yeh approach buri hai — HTML aur JS mix ho rahe hain
// Separation of concerns toot jaati hai

// ============================================================
// APPROACH 2 — JS mein property set karo (Better but limited)
// ============================================================
const owl = document.getElementById("owl");
owl.onclick = function() {
    alert("owl clicked");
};
// Problem: Sirf EK handler attach ho sakta hai
// Agar dobara owl.onclick = ... karo toh pehla overwrite ho jaata hai

// ============================================================
// APPROACH 3 — addEventListener() — BEST WAY — Hamesha yahi use karo
// ============================================================
owl.addEventListener("click", function(e) {
    console.log("owl clicked");
}, false);
// 3rd argument: false = bubbling (default), true = capturing -->
