<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Lightning Background</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #c4eafc 0%, #7185b7 40%, #2c3b6a 70%, #063474 100%);
      overflow: hidden;
    }

    /* Central Lightning Glow (10% stronger) */
    .lightning-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 770px; /* +10% */
      height: 770px; /* +10% */
      background: radial-gradient(
        circle,
        #ffffff 5%,
        #c4eafc 25%,
        #6f6e92 55%,
        transparent 80%
      );
      filter: blur(100px);
      border-radius: 50%;
      animation: pulse 3s infinite ease-in-out;
      opacity: 1; /* slightly brighter */
    }

    /* Corner blue glow (20% stronger) */
    .corner {
      position: absolute;
      width: 720px; /* +20% */
      height: 720px; /* +20% */
      background: radial-gradient(
        circle,
        rgba(113, 133, 183, 0.75) 20%,  /* stronger */
        rgba(44, 59, 106, 0.55) 50%,   /* stronger */
        rgba(6, 52, 116, 0.35) 75%,    /* stronger */
        transparent 90%
      );
      filter: blur(180px);
      border-radius: 50%;
    }

    .corner.tl { top: -250px; left: -250px; }
    .corner.tr { top: -250px; right: -250px; }
    .corner.bl { bottom: -250px; left: -250px; }
    .corner.br { bottom: -250px; right: -250px; }

    /* Pulse animation for thunder effect */
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <!-- Corner Glows -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Lightning Flash Center -->
  <div class="lightning-center"></div>
</body>
</html>
